name: Notifications quotidiennes

on:
  schedule:
    # Tous les jours à 8h UTC — déclenche /api/cron/notifications
    # (rappel J-2, message du jour J, suivi après la soirée).
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler l'endpoint de notifications
        run: |
          curl -fsS -X GET "https://felysea.onrender.com/api/cron/notifications" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
